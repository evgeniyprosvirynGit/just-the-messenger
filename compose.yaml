name: planet-chat

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
        VITE_MAPTILER_API_KEY: ${VITE_MAPTILER_API_KEY:-}
    ports:
      - "${WEB_PORT:-8090}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-planet_chat}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-planet_chat}?sslmode=disable"
      NATS_URL: "nats://nats:4222"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-}
      GOOGLE_OIDC_ISSUER: ${GOOGLE_OIDC_ISSUER:-https://accounts.google.com}
      GOOGLE_OIDC_ALLOW_INSECURE: ${GOOGLE_OIDC_ALLOW_INSECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/planet-chat", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgis/postgis:18-3.7-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-planet_chat}
      POSTGRES_USER: ${POSTGRES_USER:-planet_chat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  nats:
    image: nats:2.15.2-alpine3.22
    command: ["-m", "8222"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  playwright:
    profiles: ["test"]
    build:
      context: ./web
      dockerfile: Dockerfile.test
    environment:
      CI: "1"
      E2E_BASE_URL: http://web
      GOOGLE_E2E_BASE_URL: http://web-auth
    depends_on:
      web:
        condition: service_healthy
      web-auth:
        condition: service_healthy
    command: ["npm", "run", "test:e2e"]
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    volumes:
      - ./web/test-results:/app/test-results

volumes:
  postgres-data:
