name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create local Compose environment
        run: cp .env.example .env
      - name: Run Playwright browser checks
        run: DEV_UID="$(id -u)" DEV_GID="$(id -g)" docker compose -f compose.yaml -f compose.test.yaml --profile test run --build --rm playwright
      - name: Upload browser screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: web/test-results
      - name: Build production containers
        run: docker compose build web api
