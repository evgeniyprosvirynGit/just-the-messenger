services:
  oidc-mock:
    image: node:22-alpine
    profiles: ["test"]
    command: ["node", "/mock/oidc-mock.mjs"]
    environment:
      OIDC_MOCK_ISSUER: http://oidc-mock:8099
      OIDC_MOCK_PORT: "8099"
    volumes:
      - ./web/test-support/oidc-mock.mjs:/mock/oidc-mock.mjs:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8099/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    environment:
      GOOGLE_CLIENT_ID: meridian-playwright
      GOOGLE_CLIENT_SECRET: e2e-test-only
      GOOGLE_REDIRECT_URL: http://web-auth/api/auth/google/callback
      GOOGLE_OIDC_ISSUER: http://oidc-mock:8099
      GOOGLE_OIDC_ALLOW_INSECURE: "true"
    depends_on:
      oidc-mock:
        condition: service_healthy

  api-secondary:
    profiles: ["test"]
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-planet_chat}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-planet_chat}?sslmode=disable"
      NATS_URL: "nats://nats:4222"
    depends_on:
      api:
        condition: service_healthy
    restart: "no"
    healthcheck:
      test: ["CMD", "/planet-chat", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  web-auth:
    profiles: ["test"]
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
        VITE_MAPTILER_API_KEY: ${VITE_MAPTILER_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true

  playwright:
    depends_on:
      api-secondary:
        condition: service_healthy
